<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HL2 Hammer Oracle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body,#app{background:#050c16}
#app{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:20px;cursor:none}
canvas#bg-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.85) 100%);pointer-events:none;z-index:2}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,180,255,0.01) 3px,rgba(0,180,255,0.01) 6px);pointer-events:none;z-index:3}
#cursor{position:absolute;width:32px;height:32px;pointer-events:none;z-index:100;transform:translate(-50%,-50%)}
#corner-tl,#corner-tr,#corner-bl,#corner-br{position:absolute;width:28px;height:28px;z-index:10}
#corner-tl{top:8px;left:8px;border-top:1px solid #00b4ff55;border-left:1px solid #00b4ff55}
#corner-tr{top:8px;right:8px;border-top:1px solid #00b4ff55;border-right:1px solid #00b4ff55}
#corner-bl{bottom:8px;left:8px;border-bottom:1px solid #00b4ff55;border-left:1px solid #00b4ff55}
#corner-br{bottom:8px;right:8px;border-bottom:1px solid #00b4ff55;border-right:1px solid #00b4ff55}
#side-l,#side-r{position:absolute;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:8px}
#side-l{left:10px}#side-r{right:10px}
.side-dot{width:3px;height:3px;background:#00b4ff;border-radius:50%;opacity:0.4;animation:dotP 2s infinite}
.side-dot:nth-child(2){animation-delay:.3s}.side-dot:nth-child(3){animation-delay:.6s}.side-dot:nth-child(4){animation-delay:.9s}
@keyframes dotP{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.8;transform:scale(1.6)}}
#content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;width:100%}
h1{font-family:'Orbitron',monospace;font-size:11px;color:#00b4ff;letter-spacing:5px;text-transform:uppercase;margin-bottom:3px;text-shadow:0 0 12px #00b4ff88}
#subtitle{font-family:'Orbitron',monospace;font-size:7px;color:#00b4ff33;letter-spacing:3px;margin-bottom:12px}
#stats-bar{display:flex;gap:16px;margin-bottom:12px;font-family:'Orbitron',monospace;font-size:7px;color:#00b4ff44;letter-spacing:2px}
.stat-item{display:flex;align-items:center;gap:4px}
.stat-dot{width:4px;height:4px;border-radius:50%;background:#00b4ff;animation:dotP 1.5s infinite}
#wheel-wrap{position:relative;transition:transform 0.9s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
#wheel-wrap.result-shown{transform:translateY(130px) scale(0.48)!important;opacity:0.15;pointer-events:none}
#glow-ring{position:absolute;inset:-10px;border-radius:50%;border:1px solid #00b4ff22;pointer-events:none;animation:rP 3s ease-in-out infinite}
#glow-ring2{position:absolute;inset:-22px;border-radius:50%;border:1px solid #00b4ff0f;pointer-events:none;animation:rP 3s ease-in-out infinite .7s}
#glow-ring3{position:absolute;inset:-36px;border-radius:50%;border:1px solid #00b4ff07;pointer-events:none;animation:rP 4s ease-in-out infinite 1.2s}
@keyframes rP{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
svg#needle-svg{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:5;filter:drop-shadow(0 0 8px #ff6a00)}
canvas#wheel{display:block}
#progress-bar{width:320px;height:2px;background:#00b4ff0a;margin-top:8px}
#progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#00b4ff,#ff6a00);box-shadow:0 0 6px #00b4ff;transition:width .05s linear}
#btn-row{display:flex;gap:8px;margin-top:12px;align-items:center}
.btn-main{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;background:transparent;border:1px solid #00b4ff55;color:#00b4ff99;padding:9px 22px;cursor:none;text-transform:uppercase;transition:all .2s;position:relative;overflow:hidden}
.btn-main::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,180,255,0.12),transparent);transition:left .5s}
.btn-main:hover::after{left:100%}
.btn-main:hover{border-color:#00b4ff;color:#00b4ff;box-shadow:0 0 18px #00b4ff33}
.btn-main:disabled{opacity:.2;cursor:not-allowed}
.btn-sec{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1px;background:transparent;border:1px solid #ff6a0033;color:#ff6a0066;padding:9px 12px;cursor:none;transition:all .2s}
.btn-sec:hover{border-color:#ff6a00;color:#ff6a00;box-shadow:0 0 12px #ff6a0022}
.btn-sec:disabled{opacity:.2}
#card-area{position:absolute;top:45px;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;opacity:0;transition:opacity .5s;width:300px}
#card-area.visible{opacity:1;pointer-events:all}
.card{width:300px;background:rgba(5,14,28,0.97);border:1px solid #00b4ff33;position:relative;animation:cW 2.5s ease-in-out infinite;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,180,255,0.06),transparent 60%);pointer-events:none}
.card-holo{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .3s}
.card:hover .card-holo{opacity:1}
@keyframes cW{0%,100%{transform:rotate(-1.5deg) translateY(0)}50%{transform:rotate(1.5deg) translateY(-3px)}}
.card.flipped{animation:none}
.card-header{background:rgba(0,180,255,0.06);padding:9px 14px;font-family:'Orbitron',monospace;font-size:8px;letter-spacing:3px;color:#00b4ff99;text-align:center;border-bottom:1px solid #00b4ff1a;display:flex;align-items:center;justify-content:center;gap:8px;z-index:2;position:relative}
.hl{flex:1;height:1px;background:linear-gradient(90deg,transparent,#00b4ff33)}
.card-body{padding:18px;text-align:center;position:relative;z-index:2}
.card-qmark{font-size:48px;color:#ff6a00;font-family:'Orbitron',monospace;text-shadow:0 0 20px #ff6a0099;animation:qP 1.6s ease-in-out infinite}
@keyframes qP{0%,100%{text-shadow:0 0 10px #ff6a0055;transform:scale(1)}50%{text-shadow:0 0 28px #ff6a00cc;transform:scale(1.06)}}
.card-hint{font-size:8px;color:#00b4ff55;font-family:'Orbitron',monospace;letter-spacing:2px;margin-top:10px;animation:bl 1.8s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.card-back{display:none;padding:14px;text-align:left}
.card.flipped .card-qmark,.card.flipped .card-hint{display:none}
.card.flipped .card-back{display:block}
.diff-badge{display:inline-block;font-family:'Orbitron',monospace;font-size:7px;letter-spacing:2px;padding:3px 8px;margin:3px 0 1px;border-radius:1px}
.diff-easy{background:rgba(77,255,77,0.08);color:#4dff4d;border:1px solid #4dff4d22}
.diff-med{background:rgba(255,170,0,0.08);color:#ffaa00;border:1px solid #ffaa0022}
.diff-hard{background:rgba(255,68,68,0.08);color:#ff4444;border:1px solid #ff444422}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
.desc-text{font-size:10px;color:#7a9ab8;line-height:1.65;margin-top:2px;margin-bottom:7px}
.idea-title{font-family:'Orbitron',monospace;font-size:10px;color:#e0f0ff;margin-bottom:9px;letter-spacing:1px;text-align:center;padding-bottom:7px;border-bottom:1px solid #00b4ff15}
.project-name{font-size:7px;color:#00b4ff33;font-family:'Orbitron',monospace;letter-spacing:2px;margin-bottom:5px;text-align:center}
#reset-btn{display:none;font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;background:transparent;border:1px solid #ff6a0033;color:#ff6a0055;padding:7px 16px;cursor:none;text-transform:uppercase;transition:all .2s;margin-top:7px;width:100%}
#reset-btn:hover{background:rgba(255,106,0,0.06);border-color:#ff6a0099;color:#ff6a00}
#reset-btn.visible{display:block}
canvas#particles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:30}
#flash{position:absolute;inset:0;background:#00b4ff;opacity:0;pointer-events:none;z-index:35;transition:opacity .08s}
#hist-btn{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1px;background:transparent;border:1px solid #4dff4d22;color:#4dff4d44;padding:9px 12px;cursor:none;transition:all .2s}
#hist-btn:hover{border-color:#4dff4d66;color:#4dff4d;box-shadow:0 0 10px #4dff4d11}
#hist-panel{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:20;width:340px;background:rgba(5,14,28,0.97);border:1px solid #4dff4d22;padding:12px;display:none}
#hist-panel.visible{display:block}
#hist-panel h3{font-family:'Orbitron',monospace;font-size:8px;color:#4dff4d88;letter-spacing:3px;margin-bottom:8px;text-align:center}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #ffffff08;font-family:'Orbitron',monospace;font-size:8px}
.hist-num{color:#00b4ff44;width:20px}
.hist-title{color:#aac8e0;flex:1;padding:0 8px}
.hist-spin{color:#ff6a0055;font-size:7px}
#hist-close{font-family:'Orbitron',monospace;font-size:7px;color:#4dff4d55;background:transparent;border:1px solid #4dff4d22;padding:5px 12px;cursor:none;margin-top:8px;width:100%;transition:all .2s}
#hist-close:hover{color:#4dff4d;border-color:#4dff4d55}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg-canvas"></canvas>
  <div id="vignette"></div>
  <div class="scanlines"></div>
  <svg id="cursor" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="#00b4ff" stroke-width="0.8" opacity="0.6"/><line x1="16" y1="2" x2="16" y2="10" stroke="#00b4ff" stroke-width="0.8"/><line x1="16" y1="22" x2="16" y2="30" stroke="#00b4ff" stroke-width="0.8"/><line x1="2" y1="16" x2="10" y2="16" stroke="#00b4ff" stroke-width="0.8"/><line x1="22" y1="16" x2="30" y2="16" stroke="#00b4ff" stroke-width="0.8"/><circle cx="16" cy="16" r="1.5" fill="#ff6a00"/><circle cx="16" cy="16" r="5" fill="none" stroke="#ff6a00" stroke-width="0.5" opacity="0.5"/></svg>
  <div id="corner-tl"></div><div id="corner-tr"></div><div id="corner-bl"></div><div id="corner-br"></div>
  <div id="side-l"><div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div></div>
  <div id="side-r"><div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div></div>
  <div id="flash"></div>
  <canvas id="particles"></canvas>
  <div id="content">
    <h1>⬡ Hammer Editor — Project Oracle ⬡</h1>
    <div id="subtitle">UNION TACTICAL ASSIGNMENT SYSTEM v3.0</div>
    <div id="stats-bar">
      <div class="stat-item"><div class="stat-dot"></div><span>ONLINE</span></div>
      <div class="stat-item"><div class="stat-dot" style="animation-delay:.4s;background:#4dff4d"></div><span>20 ПРОЕКТОВ</span></div>
      <div class="stat-item"><div class="stat-dot" style="animation-delay:.8s;background:#ff6a00"></div><span id="spin-counter">СПИН #0</span></div>
    </div>
    <div id="wheel-wrap">
      <div id="glow-ring"></div><div id="glow-ring2"></div><div id="glow-ring3"></div>
      <svg id="needle-svg" width="22" height="32" viewBox="0 0 22 32"><polygon points="11,0 22,32 11,24 0,32" fill="#ff6a00"/><polygon points="11,0 22,32 11,24 0,32" fill="none" stroke="#ffaa44" stroke-width="1"/></svg>
      <canvas id="wheel" width="320" height="320"></canvas>
    </div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="btn-row">
      <button class="btn-main" id="spin-btn" onclick="spin()">▶ Получить задание</button>
      <button class="btn-sec" id="hist-btn" onclick="toggleHist()">📋</button>
      <button class="btn-sec" id="luck-btn" onclick="spin()">⚡</button>
    </div>
    <div id="card-area">
      <div class="card" id="result-card" onclick="flipCard()" onmousemove="holoMove(event)" onmouseleave="holoLeave()">
        <div class="card-holo" id="card-holo"></div>
        <div class="card-header"><div class="hl"></div><span>СЕКРЕТНОЕ ЗАДАНИЕ АЛЬЯНСА</span><div class="hl"></div></div>
        <div class="card-body">
          <div class="card-qmark">?</div>
          <div class="card-hint">[ НАЖМИ ЧТОБЫ ОТКРЫТЬ ]</div>
          <div class="card-back" id="card-back-content"></div>
        </div>
      </div>
      <button id="reset-btn" onclick="resetWheel()">↺ Новое задание</button>
    </div>
  </div>
  <div id="hist-panel">
    <h3>◆ ИСТОРИЯ ЗАДАНИЙ ◆</h3>
    <div id="hist-list"></div>
    <button id="hist-close" onclick="toggleHist()">[ ЗАКРЫТЬ ]</button>
  </div>
</div>

<script>
const ideas=[
  {title:"Камера наблюдения Альянса",easy:"Установи статичную камеру на стену, добавь prop_static модель.",med:"Сделай вращающуюся камеру через func_rotating с триггером активации.",hard:"Создай рабочую систему с func_monitor и teleport, транслирующую изображение на экран."},
  {title:"Бункер выживших",easy:"Комната с ящиками, кроватями и светом — расставь prop_static.",med:"Добавь запираемую дверь, генератор-звук и систему освещения on/off.",hard:"Полноценный бункер с NPC выжившими, диалогами, скриптованными событиями и случайными атаками."},
  {title:"Телепорт Альянса",easy:"Две комнаты соединены func_door и телепорт-триггером.",med:"Эффект частиц при входе, звук телепортации, небольшая задержка.",hard:"Двусторонний телепорт с анимацией зарядки, кат-сценой и защитным полем."},
  {title:"Ловушка для метрокопов",easy:"Яма с trigger_hurt внизу и текстурой воды.",med:"Нажимная плита запускает падающий потолок через func_movelinear.",hard:"Многоэтапная комбо-ловушка: газ → дверь → шипы → эскейп-путь для игрока."},
  {title:"Электростанция",easy:"Комната с текстурами генераторов и point_spotlight.",med:"Интерактивный рубильник меняет освещение всей карты через env_global.",hard:"Управляемая система: взрыв при перегрузке, отключение света, резервный генератор."},
  {title:"Тир для тренировок",easy:"Ряд досок-мишеней prop_physics в открытом пространстве.",med:"Автоматические мишени на рельсах func_movelinear с таймером.",hard:"Полноценный тир: счёт через logic_counter, всплывающие мишени, финальный экран."},
  {title:"Подводный тоннель",easy:"Коридор с синим освещением и текстурой воды на стёклах.",med:"Треснувшее стекло разбивается при выстреле — вода через trigger_hurt.",hard:"Затопляемый отсек с поднимающейся водой, аварийным закрытием дверей и финальным люком."},
  {title:"Лифт Альянса",easy:"func_movelinear кабина едет между двумя этажами.",med:"Двери открываются синхронно с лифтом, звук моторов и индикатор этажа.",hard:"Лифт с тремя остановками, аварийной ситуацией, сигнализацией и кат-сценой."},
  {title:"Секретная лаборатория",easy:"Белая комната с prop_static колбами и научным инвентарём.",med:"Стеклянные камеры с NPC, кнопки открытия, тревожный свет.",hard:"Активируемые эксперименты: включение машин, NPC реагируют, скрипты событий, побег."},
  {title:"Руины города",easy:"Разрушенные стены, завалы из prop_physics, HDR освещение.",med:"Скриптованный патруль метрокопов, случайные звуки окружения.",hard:"Живой район: NPC прячутся, патруль реагирует на шум, скрытный проход."},
  {title:"Верхушка башни",easy:"Высокая платформа с перилами и видом на skybox.",med:"Ветер-эффект через point_push, летящие обломки prop_physics.",hard:"Финальная арена: вертолёт Альянса атакует, укрытия, скрипты появления врагов."},
  {title:"Подземный рынок",easy:"Тёмный подвал с ящиками, баррелями и торговцем NPC.",med:"Несколько NPC с диалогами, освещение от ламп, скрытный вход.",hard:"Процедурный рынок: квест-выдача, система валюты через logic_counter, охрана реагирует."},
  {title:"Переправа на лодке",easy:"Статичная лодка на воде с красивым закатом skybox.",med:"Движущаяся лодка по пути func_tracktrain вдоль береговой линии.",hard:"Управляемая лодка под обстрелом с берега, укрытия, финальная высадка."},
  {title:"Арсенал повстанцев",easy:"Комната с оружием на стенах и ящиками с патронами.",med:"Замаскированный вход (сдвижная полка), охраняющий NPC.",hard:"Система доступа по коду, сигнализация при взломе, эвакуационный туннель."},
  {title:"Тюрьма Новы Просперо",easy:"Клетки из metal_fence_001 с prisoner NPC внутри.",med:"Охрана на патруле, отключаемые клетки через кнопку.",hard:"Побег: отключение охраны, несколько путей, финальная дверь с кодовым замком."},
  {title:"Заброшенная церковь",easy:"Высокий неф с витражами (цветные стёкла) и dustmotes.",med:"Скрипт: дверь скрипит, летучие мыши разлетаются при входе.",hard:"Загадка внутри: алтарь-пазл активирует скрытый проход в катакомбы."},
  {title:"Маяк",easy:"Высокая башня с вращающимся прожектором через func_rotating.",med:"Механизм подъёма по лестнице, вид на море, звуки волн.",hard:"Маяк как ориентир: сигнальные огни меняют поведение NPC на карте."},
  {title:"Поезд Альянса",easy:"Вагон-платформа на рельсах, статичная сцена на станции.",med:"Движущийся поезд func_tracktrain, игрок едет внутри вагона.",hard:"Экшн на поезде: враги запрыгивают, вагоны отцепляются, финальный взрыв локомотива."},
  {title:"Дамба",easy:"Огромная стена дамбы из displacement с водой внизу.",med:"Шлюзовые ворота открываются, уровень воды поднимается через logic_timer.",hard:"Саботаж: заложи взрывчатку, дамба рушится, волна меняет геометрию уровня."},
  {title:"Командный центр Альянса",easy:"Круглый зал с экранами env_sprite и стойками офицеров.",med:"Рабочие терминалы с info_overlay, NPC офицеры с диалогами.",hard:"Взлом системы: мини-пазл на терминале, тревога, экстренный протокол блокировки."}
];

const COLORS=["#ff6a00","#00b4ff","#4dff4d","#ff4444","#ffaa00","#cc44ff","#00ffcc","#ff66aa","#ffee44","#44aaff"];
const N=ideas.length,W=320,R=145,cx=160,cy=160;
let angle=0,spinning=false,resultIdx=-1,particles=[],spinCount=0,history=[],histVisible=false,hoverSector=-1;

// --- AUDIO ---
let actx=null;
function getACtx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx}
function playClick(){
  try{const a=getACtx(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);
  o.frequency.setValueAtTime(1200,a.currentTime);o.frequency.exponentialRampToValueAtTime(400,a.currentTime+0.04);
  g.gain.setValueAtTime(0.08,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.04);
  o.start();o.stop(a.currentTime+0.04)}catch(e){}
}
function playStop(){
  try{const a=getACtx();
  [80,60,40].forEach((f,i)=>{
    const o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.type='sawtooth';o.frequency.setValueAtTime(f,a.currentTime+i*0.12);
    g.gain.setValueAtTime(0.12,a.currentTime+i*0.12);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+i*0.12+0.4);
    o.start(a.currentTime+i*0.12);o.stop(a.currentTime+i*0.12+0.4);
  })}catch(e){}
}
function playZap(){
  try{const a=getACtx(),buf=a.createBuffer(1,a.sampleRate*0.3,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
  s.buffer=buf;f.type='bandpass';f.frequency.value=2000;f.Q.value=0.5;
  s.connect(f);f.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(0.18,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.3);
  s.start()}catch(e){}
}

// --- BG CANVAS ---
const bgC=document.getElementById('bg-canvas');
const bgX=bgC.getContext('2d');
let bgW=0,bgH=0;
function resizeBg(){bgW=bgC.width=bgC.offsetWidth;bgH=bgC.height=bgC.offsetHeight}
resizeBg();window.addEventListener('resize',resizeBg);

const beams=Array.from({length:6},(_,i)=>({x:Math.random()*800,y:-200,angle:Math.PI/2+((Math.random()-.5)*0.4),speed:.4+Math.random()*.3,w:40+Math.random()*80,opacity:.03+Math.random()*.04,hue:i%2?200:30}));
let bgFrame=0;
function drawBg(){
  bgX.clearRect(0,0,bgW,bgH);
  bgX.fillStyle='#050c16';bgX.fillRect(0,0,bgW,bgH);
  bgX.strokeStyle='rgba(0,180,255,0.035)';bgX.lineWidth=1;
  const gs=50;
  for(let x=0;x<bgW;x+=gs){bgX.beginPath();bgX.moveTo(x,0);bgX.lineTo(x,bgH);bgX.stroke()}
  for(let y=0;y<bgH;y+=gs){bgX.beginPath();bgX.moveTo(0,y);bgX.lineTo(bgW,y);bgX.stroke()}
  beams.forEach(b=>{
    const bx=b.x+Math.sin(bgFrame*.008+b.y*.002)*80;
    const grad=bgX.createLinearGradient(bx,0,bx+Math.cos(b.angle)*bgH,bgH);
    grad.addColorStop(0,`hsla(${b.hue},100%,60%,${b.opacity*1.5})`);
    grad.addColorStop(1,'transparent');
    bgX.beginPath();bgX.moveTo(bx-b.w,0);bgX.lineTo(bx+b.w,0);
    bgX.lineTo(bx+b.w+Math.cos(b.angle)*bgH*0.6,bgH);
    bgX.lineTo(bx-b.w+Math.cos(b.angle)*bgH*0.6,bgH);
    bgX.closePath();bgX.fillStyle=grad;bgX.fill();
    b.y+=b.speed;if(b.y>bgH+400)b.y=-400;
  });
  if(bgFrame%3===0){
    bgX.fillStyle='rgba(0,180,255,0.5)';
    for(let i=0;i<3;i++){
      const rx=Math.random()*bgW,ry=Math.random()*bgH;
      bgX.fillRect(rx,ry,1,4+Math.random()*8);
    }
  }
  bgFrame++;
  requestAnimationFrame(drawBg);
}
drawBg();

// --- WHEEL ---
const canvas=document.getElementById('wheel');
const ctx=canvas.getContext('2d');
function drawWheel(a){
  ctx.clearRect(0,0,W,W);
  const slice=Math.PI*2/N;
  for(let i=0;i<N;i++){
    const s=a+i*slice,e=s+slice;
    const col=COLORS[i%COLORS.length];
    const isHover=(i===hoverSector);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,s,e);ctx.closePath();
    ctx.fillStyle=isHover?col+'44':col+'14';
    ctx.strokeStyle=isHover?col+'99':col+'44';
    ctx.lineWidth=isHover?1.5:0.7;ctx.fill();ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(s+slice/2);ctx.translate(R*.65,0);
    ctx.font=`bold ${isHover?'20':'15'}px Orbitron,monospace`;
    ctx.fillStyle=isHover?'#ffffff':col+'88';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',0,0);ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='#00b4ff22';ctx.lineWidth=1.2;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,22,0,Math.PI*2);
  ctx.fillStyle='#050c16';ctx.fill();ctx.strokeStyle='#00b4ff77';ctx.lineWidth=1.2;ctx.stroke();
  ctx.font='bold 7px Orbitron,monospace';ctx.fillStyle='#00b4ff';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('HL2',cx,cy);
}
drawWheel(0);

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left-cx,my=e.clientY-r.top-cy;
  const dist=Math.sqrt(mx*mx+my*my);
  if(dist<R&&dist>20){
    let a=Math.atan2(my,mx)-angle;
    a=(a%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    hoverSector=Math.floor(a/(Math.PI*2/N));
  }else hoverSector=-1;
  if(!spinning&&resultIdx===-1)drawWheel(angle);
});
canvas.addEventListener('mouseleave',()=>{hoverSector=-1;if(!spinning&&resultIdx===-1)drawWheel(angle);});

// --- CURSOR ---
const cursorEl=document.getElementById('cursor');
document.getElementById('app').addEventListener('mousemove',e=>{
  const r=document.getElementById('app').getBoundingClientRect();
  cursorEl.style.left=(e.clientX-r.left)+'px';
  cursorEl.style.top=(e.clientY-r.top)+'px';
  if(!document.getElementById('wheel-wrap').classList.contains('result-shown')&&!spinning){
    const dx=(e.clientX-r.left)/r.width-.5;
    const dy=(e.clientY-r.top)/r.height-.5;
    document.getElementById('wheel-wrap').style.transform=`perspective(700px) rotateY(${dx*8}deg) rotateX(${-dy*5}deg)`;
  }
});
document.getElementById('app').addEventListener('mouseleave',()=>{
  if(!document.getElementById('wheel-wrap').classList.contains('result-shown'))
    document.getElementById('wheel-wrap').style.transform='perspective(700px) rotateY(0) rotateX(0)';
});

// --- PROGRESS ---
let progTimer=null;
function animProgress(dur){
  const fill=document.getElementById('progress-fill');
  const t0=performance.now();
  clearInterval(progTimer);
  progTimer=setInterval(()=>{
    const t=Math.min((performance.now()-t0)/dur,1);
    fill.style.width=t*100+'%';
    if(t>=1){clearInterval(progTimer);setTimeout(()=>{fill.style.width='0%'},400)}
  },16);
}

// --- SPIN ---
function spin(){
  if(spinning)return;
  getACtx();
  spinning=true;
  document.getElementById('spin-btn').disabled=true;
  document.getElementById('luck-btn').disabled=true;
  const dur=3500+Math.random()*2500;
  animProgress(dur);
  const extra=Math.PI*2*(7+Math.random()*10);
  const stop=Math.random()*Math.PI*2;
  const total=extra+stop;
  const t0=performance.now();
  let lastSector=-1;
  function frame(now){
    const t=Math.min((now-t0)/dur,1);
    const ease=1-Math.pow(1-t,4);
    angle=ease*total;
    const slice=Math.PI*2/N;
    const ptr=-Math.PI/2;
    let norm=((ptr-angle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    const cur=Math.floor(norm/slice)%N;
    if(cur!==lastSector){playClick();lastSector=cur}
    drawWheel(angle);
    if(t<1){requestAnimationFrame(frame)}
    else{
      angle=total%(Math.PI*2);drawWheel(angle);
      let norm2=((ptr-angle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
      resultIdx=Math.floor(norm2/slice)%N;
      spinning=false;spinCount++;
      document.getElementById('spin-counter').textContent='СПИН #'+spinCount;
      playStop();flashScreen();
      setTimeout(showCard,500);
    }
  }
  requestAnimationFrame(frame);
}

function flashScreen(col){
  const f=document.getElementById('flash');
  f.style.background=col||'#00b4ff';f.style.opacity='0.1';
  setTimeout(()=>f.style.opacity='0',120);
}

// --- CARD ---
function showCard(){
  document.getElementById('wheel-wrap').classList.add('result-shown');
  const ca=document.getElementById('card-area');ca.classList.add('visible');
  document.getElementById('card-back-content').innerHTML=
    `<div class="project-name">ПРОЕКТ ${resultIdx+1} / ${N} — СПИН #${spinCount}</div>
<div class="idea-title" id="card-title-txt"></div>
<div id="diff-block" style="display:none">
<div><span class="diff-badge diff-easy">◆ ЛЁГКОЕ</span><div class="desc-text" id="dt-e"></div></div>
<div><span class="diff-badge diff-med">◆ СРЕДНЕЕ</span><div class="desc-text" id="dt-m"></div></div>
<div><span class="diff-badge diff-hard" id="hard-badge">◆ СЛОЖНОЕ!</span><div class="desc-text" id="dt-h"></div></div>
</div>`;
  document.getElementById('reset-btn').classList.add('visible');
}

function flipCard(){
  const card=document.getElementById('result-card');
  if(card.classList.contains('flipped'))return;
  card.classList.add('flipped');
  playZap();flashScreen('#ff6a00');
  launchParticles();
  history.unshift({title:ideas[resultIdx].title,spin:spinCount,idx:resultIdx});
  if(history.length>5)history.pop();
  const idea=ideas[resultIdx];
  typeText('card-title-txt',idea.title,()=>{
    document.getElementById('diff-block').style.display='block';
    typeText('dt-e',idea.easy,()=>{
      typeText('dt-m',idea.med,()=>{
        typeText('dt-h',idea.hard,()=>{
          const hb=document.getElementById('hard-badge');
          if(hb)hb.style.animation='shake .18s infinite';
        });
      });
    });
  });
}

function typeText(id,text,cb){
  const el=document.getElementById(id);if(!el)return;
  el.innerHTML='';let i=0;
  const iv=setInterval(()=>{
    el.innerHTML=text.slice(0,i)+'<span style="border-right:1px solid #00b4ff88"> </span>';
    i++;if(i>text.length){clearInterval(iv);el.innerHTML=text;if(cb)cb()}
  },22);
}

function holoMove(e){
  const r=document.getElementById('result-card').getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  const holo=document.getElementById('card-holo');
  holo.style.background=`radial-gradient(circle at ${x*100}% ${y*100}%,rgba(0,180,255,0.15),rgba(255,106,0,0.08),transparent 70%)`;
  holo.style.opacity='1';
}
function holoLeave(){document.getElementById('card-holo').style.opacity='0'}

// --- PARTICLES ---
const pCanvas=document.getElementById('particles');
const pCtx=pCanvas.getContext('2d');
function resizeP(){pCanvas.width=pCanvas.offsetWidth;pCanvas.height=pCanvas.offsetHeight}
resizeP();window.addEventListener('resize',resizeP);

function launchParticles(){
  const appR=document.getElementById('app').getBoundingClientRect();
  const cardR=document.getElementById('result-card').getBoundingClientRect();
  const ox=cardR.left-appR.left+cardR.width/2,oy=cardR.top-appR.top+cardR.height/2;
  const cols=["#ff6a00","#00b4ff","#4dff4d","#ff4444","#ffaa00","#cc44ff","#ff66aa","#fff","#00ffcc","#ffee44"];
  particles=[];
  for(let i=0;i<90;i++){
    const a=Math.random()*Math.PI*2,spd=2+Math.random()*10;
    particles.push({x:ox,y:oy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-3,
      w:3+Math.random()*11,h:3+Math.random()*11,
      rot:Math.random()*360,vr:(Math.random()-.5)*16,
      col:cols[Math.floor(Math.random()*cols.length)],life:1,trail:[]});
  }
  animP();
}

function animP(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  let alive=false;
  for(const p of particles){
    if(p.life<=0)continue;alive=true;
    p.trail.push({x:p.x,y:p.y,a:p.life});
    if(p.trail.length>14)p.trail.shift();
    for(let i=0;i<p.trail.length-1;i++){
      const t0=p.trail[i],t1=p.trail[i+1];
      pCtx.beginPath();pCtx.moveTo(t0.x,t0.y);pCtx.lineTo(t1.x,t1.y);
      pCtx.strokeStyle=`rgba(255,255,255,${t0.a*(i/p.trail.length)*.45})`;
      pCtx.lineWidth=1.5;pCtx.stroke();
    }
    pCtx.save();pCtx.translate(p.x,p.y);pCtx.rotate(p.rot*Math.PI/180);
    pCtx.fillStyle=p.col+Math.floor(p.life*255).toString(16).padStart(2,'0');
    pCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);pCtx.restore();
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.22;p.vx*=.985;p.rot+=p.vr;p.life-=.015;
  }
  if(alive)requestAnimationFrame(animP);
  else pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
}

// --- HISTORY ---
function toggleHist(){
  histVisible=!histVisible;
  const p=document.getElementById('hist-panel');
  if(histVisible){
    p.classList.add('visible');
    const list=document.getElementById('hist-list');
    if(history.length===0){list.innerHTML='<div style="font-family:Orbitron,monospace;font-size:8px;color:#00b4ff22;text-align:center;padding:10px">НЕТ ЗАПИСЕЙ</div>'}
    else{list.innerHTML=history.map((h,i)=>
      `<div class="hist-item"><span class="hist-num">${i+1}</span><span class="hist-title">${h.title}</span><span class="hist-spin">СПИН #${h.spin}</span></div>`
    ).join('')}
  }else{p.classList.remove('visible')}
}

// --- RESET ---
function resetWheel(){
  document.getElementById('wheel-wrap').classList.remove('result-shown');
  document.getElementById('wheel-wrap').style.transform='perspective(700px) rotateY(0) rotateX(0)';
  document.getElementById('card-area').classList.remove('visible');
  document.getElementById('result-card').classList.remove('flipped');
  document.getElementById('reset-btn').classList.remove('visible');
  document.getElementById('spin-btn').disabled=false;
  document.getElementById('luck-btn').disabled=false;
  resultIdx=-1;particles=[];pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  drawWheel(angle);
}

// --- IDLE ROTATE ---
let idleAngle=0;
function idle(){
  if(!spinning&&resultIdx===-1){idleAngle+=0.0015;angle=idleAngle;drawWheel(idleAngle)}
  requestAnimationFrame(idle);
}
idle();
</script>
