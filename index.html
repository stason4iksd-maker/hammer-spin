<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HL2 Hammer Oracle v5</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body,#app{background:#050c16}
#app{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:20px;cursor:none}
canvas#bg-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.85)100%);pointer-events:none;z-index:2}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,180,255,0.01)3px,rgba(0,180,255,0.01)6px);pointer-events:none;z-index:3}
#cursor{position:absolute;width:32px;height:32px;pointer-events:none;z-index:100;transform:translate(-50%,-50%)}
#corner-tl,#corner-tr,#corner-bl,#corner-br{position:absolute;width:28px;height:28px;z-index:10}
#corner-tl{top:8px;left:8px;border-top:1px solid #00b4ff55;border-left:1px solid #00b4ff55}
#corner-tr{top:8px;right:8px;border-top:1px solid #00b4ff55;border-right:1px solid #00b4ff55}
#corner-bl{bottom:8px;left:8px;border-bottom:1px solid #00b4ff55;border-left:1px solid #00b4ff55}
#corner-br{bottom:8px;right:8px;border-bottom:1px solid #00b4ff55;border-right:1px solid #00b4ff55}
#side-l,#side-r{position:absolute;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:8px}
#side-l{left:10px}#side-r{right:10px}
.side-dot{width:3px;height:3px;background:#00b4ff;border-radius:50%;opacity:.4;animation:dotP 2s infinite}
.side-dot:nth-child(2){animation-delay:.3s}.side-dot:nth-child(3){animation-delay:.6s}.side-dot:nth-child(4){animation-delay:.9s}
@keyframes dotP{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.8;transform:scale(1.6)}}
#content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;width:100%}
h1{font-family:'Orbitron',monospace;font-size:11px;color:#00b4ff;letter-spacing:5px;text-transform:uppercase;margin-bottom:3px;text-shadow:0 0 12px #00b4ff88}
#subtitle{font-family:'Orbitron',monospace;font-size:7px;color:#00b4ff33;letter-spacing:3px;margin-bottom:12px}
#stats-bar{display:flex;gap:16px;margin-bottom:12px;font-family:'Orbitron',monospace;font-size:7px;color:#00b4ff44;letter-spacing:2px}
.stat-item{display:flex;align-items:center;gap:4px}
.stat-dot{width:4px;height:4px;border-radius:50%;background:#00b4ff;animation:dotP 1.5s infinite}
#wheel-wrap{position:relative;transition:transform 0.9s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
#wheel-wrap.result-shown{transform:translateY(130px) scale(0.48)!important;opacity:0.15;pointer-events:none}
#glow-ring{position:absolute;inset:-10px;border-radius:50%;border:1px solid #00b4ff22;pointer-events:none;animation:rP 3s ease-in-out infinite}
#glow-ring2{position:absolute;inset:-22px;border-radius:50%;border:1px solid #00b4ff0f;pointer-events:none;animation:rP 3s ease-in-out infinite .7s}
#glow-ring3{position:absolute;inset:-36px;border-radius:50%;border:1px solid #00b4ff07;pointer-events:none;animation:rP 4s ease-in-out infinite 1.2s}
@keyframes rP{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
svg#needle-svg{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:5;filter:drop-shadow(0 0 8px #ff6a00)}
canvas#wheel{display:block}
#progress-bar{width:320px;height:2px;background:#00b4ff0a;margin-top:8px}
#progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#00b4ff,#ff6a00);box-shadow:0 0 6px #00b4ff;transition:width .05s linear}
#btn-row{display:flex;gap:8px;margin-top:12px;align-items:center}
.btn-main{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;background:transparent;border:1px solid #00b4ff55;color:#00b4ff99;padding:9px 22px;cursor:none;text-transform:uppercase;transition:all .2s;position:relative;overflow:hidden}
.btn-main::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,180,255,0.12),transparent);transition:left .5s}
.btn-main:hover::after{left:100%}
.btn-main:hover{border-color:#00b4ff;color:#00b4ff;box-shadow:0 0 18px #00b4ff33}
.btn-main:disabled{opacity:.2;cursor:not-allowed}
.btn-sec{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1px;background:transparent;border:1px solid #ff6a0033;color:#ff6a0066;padding:9px 12px;cursor:none;transition:all .2s}
.btn-sec:hover{border-color:#ff6a00;color:#ff6a00;box-shadow:0 0 12px #ff6a0022}
.btn-sec:disabled{opacity:.2}
/* CARD AREA */
#card-area{position:absolute;top:30px;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;opacity:0;transition:opacity .5s;width:min(1240px,calc(100% - 24px));display:flex;justify-content:center;align-items:flex-start;gap:16px}
#card-area.visible{opacity:1;pointer-events:all}
.result-layout{width:100%;display:flex;justify-content:center;align-items:flex-start;gap:16px;flex-wrap:wrap}
.card-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0}
.card{width:288px;background:rgba(5,14,28,0.97);border:1px solid #00b4ff33;position:relative;animation:cW 2.5s ease-in-out infinite;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,180,255,0.06),transparent 60%);pointer-events:none}
.card-holo{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .3s}
.card:hover .card-holo{opacity:1}
@keyframes cW{0%,100%{transform:rotate(-1.5deg) translateY(0)}50%{transform:rotate(1.5deg) translateY(-3px)}}
.card.flipped{animation:none}
.card-header{background:rgba(0,180,255,0.06);padding:9px 14px;font-family:'Orbitron',monospace;font-size:8px;letter-spacing:3px;color:#00b4ff99;text-align:center;border-bottom:1px solid #00b4ff1a;display:flex;align-items:center;justify-content:center;gap:8px;z-index:2;position:relative}
.hl{flex:1;height:1px;background:linear-gradient(90deg,transparent,#00b4ff33)}
.card-body{padding:18px;text-align:center;position:relative;z-index:2}
.card-qmark{font-size:48px;color:#ff6a00;font-family:'Orbitron',monospace;text-shadow:0 0 20px #ff6a0099;animation:qP 1.6s ease-in-out infinite}
@keyframes qP{0%,100%{text-shadow:0 0 10px #ff6a0055;transform:scale(1)}50%{text-shadow:0 0 28px #ff6a00cc;transform:scale(1.06)}}
.card-hint{font-size:8px;color:#00b4ff55;font-family:'Orbitron',monospace;letter-spacing:2px;margin-top:10px;animation:bl 1.8s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.card-back{display:none;padding:14px;text-align:left}
.card.flipped .card-qmark,.card.flipped .card-hint{display:none}
.card.flipped .card-back{display:block}
.diff-badge{display:inline-block;font-family:'Orbitron',monospace;font-size:7px;letter-spacing:2px;padding:3px 8px;margin:3px 0 1px;border-radius:1px}
.diff-easy{background:rgba(77,255,77,.08);color:#4dff4d;border:1px solid #4dff4d22}
.diff-med{background:rgba(255,170,0,.08);color:#ffaa00;border:1px solid #ffaa0022}
.diff-hard{background:rgba(255,68,68,.08);color:#ff4444;border:1px solid #ff444422}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
.desc-text{font-size:10px;color:#7a9ab8;line-height:1.65;margin-top:2px;margin-bottom:7px}
.idea-title{font-family:'Orbitron',monospace;font-size:10px;color:#e0f0ff;margin-bottom:9px;letter-spacing:1px;text-align:center;padding-bottom:7px;border-bottom:1px solid #00b4ff15}
.project-name{font-size:7px;color:#00b4ff33;font-family:'Orbitron',monospace;letter-spacing:2px;margin-bottom:5px;text-align:center}
#reset-btn{display:none;font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;background:transparent;border:1px solid #ff6a0033;color:#ff6a0055;padding:7px 16px;cursor:none;text-transform:uppercase;transition:all .2s;margin-top:7px;width:100%}
#reset-btn:hover{background:rgba(255,106,0,.06);border-color:#ff6a0099;color:#ff6a00}
#reset-btn.visible{display:block}
canvas#particles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:30}
#flash{position:absolute;inset:0;background:#00b4ff;opacity:0;pointer-events:none;z-index:35;transition:opacity .08s}
#hist-btn{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1px;background:transparent;border:1px solid #4dff4d22;color:#4dff4d44;padding:9px 12px;cursor:none;transition:all .2s}
#hist-btn:hover{border-color:#4dff4d66;color:#4dff4d;box-shadow:0 0 10px #4dff4d11}
#hist-panel{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:20;width:340px;background:rgba(5,14,28,.97);border:1px solid #4dff4d22;padding:12px;display:none}
#hist-panel.visible{display:block}
#hist-panel h3{font-family:'Orbitron',monospace;font-size:8px;color:#4dff4d88;letter-spacing:3px;margin-bottom:8px;text-align:center}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #ffffff08;font-family:'Orbitron',monospace;font-size:8px}
.hist-num{color:#00b4ff44;width:20px}.hist-title{color:#aac8e0;flex:1;padding:0 8px}.hist-spin{color:#ff6a0055;font-size:7px}
#hist-close{font-family:'Orbitron',monospace;font-size:7px;color:#4dff4d55;background:transparent;border:1px solid #4dff4d22;padding:5px 12px;cursor:none;margin-top:8px;width:100%;transition:all .2s}
#hist-close:hover{color:#4dff4d;border-color:#4dff4d55}

/* ===== MAP PANEL ===== */
#map-panel{flex:1;min-width:300px;max-width:720px;background:rgba(5,14,28,.97);border:1px solid #00b4ff22;padding:12px;opacity:0;transform:translateX(16px);transition:opacity .5s,transform .5s;pointer-events:none}
#map-panel.visible{opacity:1;transform:translateX(0);pointer-events:all}
.mp-head{border-bottom:1px solid #00b4ff15;padding-bottom:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.mp-title{font-family:'Orbitron',monospace;font-size:8px;color:#00b4ff88;letter-spacing:3px}
.mp-project{font-family:'Orbitron',monospace;font-size:7px;color:#aac8e055;letter-spacing:1px}
/* diff + mode buttons */
.mp-controls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.mp-btn{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;background:transparent;border:1px solid #00b4ff22;color:#00b4ff66;padding:5px 10px;cursor:none;transition:all .2s;text-transform:uppercase}
.mp-btn:hover{border-color:#00b4ff55;color:#00b4ff}
.mp-btn.active-easy{background:#4dff4d;color:#050c16;border-color:transparent}
.mp-btn.active-med{background:#ffaa00;color:#050c16;border-color:transparent}
.mp-btn.active-hard{background:#ff4444;color:#050c16;border-color:transparent}
.mp-btn.active-mode{background:#00b4ff22;color:#00b4ff;border-color:#00b4ff55}
/* viewport */
.vp-shell{border:1px solid #00b4ff1a;background:#06101e;overflow:hidden}
.vp-topbar{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-bottom:1px solid #00b4ff12;font-family:'Orbitron',monospace;font-size:6px;letter-spacing:2px;color:#7dbfe0;text-transform:uppercase}
.vp-canvaswrap{position:relative;width:100%;height:340px;overflow:hidden;cursor:none}
canvas.vp-c{width:100%;height:100%;display:block}
.vp-overlay{position:absolute;pointer-events:none;font-family:'Orbitron',monospace;font-size:6px;letter-spacing:1px;color:#00b4ff44}
#vp-coords{top:8px;right:8px}
#vp-zoom{bottom:8px;right:8px;color:#00b4ff55}
#vp-hint{bottom:8px;left:8px;color:#00b4ff33}
/* stats */
.mp-stats{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 0 0;font-family:'Orbitron',monospace;font-size:6px;letter-spacing:1px;color:#aac8e0;border-top:1px solid #00b4ff12;margin-top:8px}
.mp-stats span{color:#00b4ff}
/* entities */
.mp-entities{margin-top:8px;padding-top:8px;border-top:1px solid #00b4ff12}
.mp-ent-title{font-family:'Orbitron',monospace;font-size:6px;color:#ff6a0088;letter-spacing:2px;margin-bottom:5px}
.mp-ent-list{display:flex;flex-wrap:wrap;gap:4px}
.mp-ent{font-family:'Orbitron',monospace;font-size:6px;color:#ff6a0066;border:1px solid #ff6a0022;padding:2px 6px;letter-spacing:1px}
/* legend */
.mp-legend{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:8px;font-family:'Orbitron',monospace;font-size:6px;letter-spacing:1px;color:#aac8e0}
.leg{display:flex;align-items:center;gap:4px}
.leg-sw{width:8px;height:8px;border:1px solid currentColor;display:inline-block}
/* regen btn */
.mp-regen{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;background:transparent;border:1px solid #00b4ff22;color:#00b4ff55;padding:5px 14px;cursor:none;transition:all .2s;text-transform:uppercase;margin-top:8px}
.mp-regen:hover{border-color:#00b4ff;color:#00b4ff;box-shadow:0 0 8px #00b4ff22}
@media(max-width:860px){#card-area{position:relative;top:auto;left:auto;transform:none;padding-top:36px;width:100%}.result-layout{flex-direction:column;align-items:center}#map-panel{max-width:100%;width:100%;min-width:0;transform:translateY(10px)}#map-panel.visible{transform:translateY(0)}}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg-canvas"></canvas>
  <div id="vignette"></div><div class="scanlines"></div>
  <svg id="cursor" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="#00b4ff" stroke-width=".8" opacity=".6"/><line x1="16" y1="2" x2="16" y2="10" stroke="#00b4ff" stroke-width=".8"/><line x1="16" y1="22" x2="16" y2="30" stroke="#00b4ff" stroke-width=".8"/><line x1="2" y1="16" x2="10" y2="16" stroke="#00b4ff" stroke-width=".8"/><line x1="22" y1="16" x2="30" y2="16" stroke="#00b4ff" stroke-width=".8"/><circle cx="16" cy="16" r="1.5" fill="#ff6a00"/><circle cx="16" cy="16" r="5" fill="none" stroke="#ff6a00" stroke-width=".5" opacity=".5"/></svg>
  <div id="corner-tl"></div><div id="corner-tr"></div><div id="corner-bl"></div><div id="corner-br"></div>
  <div id="side-l"><div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div></div>
  <div id="side-r"><div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div><div class="side-dot"></div></div>
  <div id="flash"></div><canvas id="particles"></canvas>
  <div id="content">
    <h1>⬡ Hammer Editor — Project Oracle ⬡</h1>
    <div id="subtitle">UNION TACTICAL ASSIGNMENT SYSTEM v5.0</div>
    <div id="stats-bar">
      <div class="stat-item"><div class="stat-dot"></div><span>ONLINE</span></div>
      <div class="stat-item"><div class="stat-dot" style="animation-delay:.4s;background:#4dff4d"></div><span>20 ПРОЕКТОВ</span></div>
      <div class="stat-item"><div class="stat-dot" style="animation-delay:.8s;background:#ff6a00"></div><span id="spin-counter">СПИН #0</span></div>
    </div>
    <div id="wheel-wrap">
      <div id="glow-ring"></div><div id="glow-ring2"></div><div id="glow-ring3"></div>
      <svg id="needle-svg" width="22" height="32" viewBox="0 0 22 32"><polygon points="11,0 22,32 11,24 0,32" fill="#ff6a00"/><polygon points="11,0 22,32 11,24 0,32" fill="none" stroke="#ffaa44" stroke-width="1"/></svg>
      <canvas id="wheel" width="320" height="320"></canvas>
    </div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="btn-row">
      <button class="btn-main" id="spin-btn" onclick="spin()">▶ Получить задание</button>
      <button class="btn-sec" id="hist-btn" onclick="toggleHist()">📋</button>
      <button class="btn-sec" id="luck-btn" onclick="spin()">⚡</button>
    </div>
    <div id="card-area">
      <div class="result-layout">
        <div class="card-wrap">
          <div class="card" id="result-card" onclick="flipCard()" onmousemove="holoMove(event)" onmouseleave="holoLeave()">
            <div class="card-holo" id="card-holo"></div>
            <div class="card-header"><div class="hl"></div><span>СЕКРЕТНОЕ ЗАДАНИЕ АЛЬЯНСА</span><div class="hl"></div></div>
            <div class="card-body">
              <div class="card-qmark">?</div>
              <div class="card-hint">[ НАЖМИ ЧТОБЫ ОТКРЫТЬ ]</div>
              <div class="card-back" id="card-back-content"></div>
            </div>
          </div>
          <button id="reset-btn" onclick="resetWheel()">↺ Новое задание</button>
        </div>
        <div id="map-panel"></div>
      </div>
    </div>
  </div>
  <div id="hist-panel">
    <h3>◆ ИСТОРИЯ ЗАДАНИЙ ◆</h3>
    <div id="hist-list"></div>
    <button id="hist-close" onclick="toggleHist()">[ ЗАКРЫТЬ ]</button>
  </div>
</div>
<script>
// ===================== IDEAS DATA =====================
const ideas=[
  {title:"Камера наблюдения Альянса",
   easy:"Создай небольшой пост с одной камерой, дисплеем и опорными элементами окружения.",
   med:"Мини-узел охраны с вращающейся камерой, комнатой оператора и коридором доступа.",
   hard:"Полноценный центр наблюдения: несколько камер, диспетчерская, тревожная комната, скриптовые события.",
   generator:{
     easy:{rooms:["green","green","purple"],names:["Пост охраны","Зона дисплея","Комната камер"],entities:["npc_metropolice","func_door","env_sprite"]},
     med:{rooms:["green","yellow","green","purple","green"],names:["Патрульный блок","Переход","Оператор","Узел камер","Коридор"],entities:["npc_metropolice","npc_combine_s","func_rotating","logic_relay"]},
     hard:{rooms:["green","green","red","purple","green","purple","blue"],names:["КПП","Диспетчерская","Серверный тоннель","Центр наблюдения","Тревожный отсек","Лаборатория слежки","Аварийный сток"],entities:["npc_combine_s","npc_metropolice","func_monitor","logic_relay","ambient_generic","trigger_once"]}
   }},
  {title:"Бункер выживших",
   easy:"Небольшое убежище с кроватями, ящиками, запасами и простыми источниками света.",
   med:"Живой бункер: генератор, запираемые двери, уголок с припасами и обходной маршрут.",
   hard:"База сопротивления: несколько комнат, общий зал, технический отсек, аварийный проход.",
   generator:{
     easy:{rooms:["green","green","green"],names:["Вход","Жилой отсек","Склад"],entities:["prop_physics","func_door","ambient_generic"]},
     med:{rooms:["yellow","green","green","red","green"],names:["Замаскированный вход","Жилой блок","Штаб","Технический тоннель","Генераторная"],entities:["npc_citizen","func_door","prop_physics","ambient_generic"]},
     hard:{rooms:["red","green","green","purple","green","green","blue"],names:["Скрытый лаз","Вход","Жилой зал","Командный центр","Мастерская","Медпункт","Аварийный дренаж"],entities:["npc_citizen","npc_rebel","func_door","logic_relay","ambient_generic","prop_physics"]}
   }},
  {title:"Телепорт Альянса",
   easy:"Две комнаты с телепортационной связью, точка входа и приёмник.",
   med:"Эффект зарядки, задержка, визуальный отклик. Маршрут через подготовительную комнату.",
   hard:"Двусторонний телепорт с кат-сценой, защитным полем и возможной поломкой системы.",
   generator:{
     easy:{rooms:["green","purple","green"],names:["Зал ожидания","Телепорт-камера","Зона прибытия"],entities:["env_sprite","ambient_generic","trigger_teleport"]},
     med:{rooms:["green","yellow","purple","green","red"],names:["Зал доступа","Переходной мост","Активационная камера","Зона прибытия","Энергетический тоннель"],entities:["env_sprite","logic_relay","trigger_teleport","ambient_generic","func_door"]},
     hard:{rooms:["green","purple","blue","purple","green","red","green"],names:["Бюро пропусков","Камера зарядки","Стабилизирующий резервуар","Ядро телепорта","Зона выхода","Кабельный тоннель","КПП Альянса"],entities:["env_sprite","logic_relay","trigger_teleport","env_beam","func_brush","ambient_generic","npc_combine_s"]}
   }},

// ===================== MAP LAYOUT ENGINE =====================
// Arranges rooms in a logical TREE from top to bottom (main chain with branches)
function buildLayout(rooms,names){
  const NODE_W=96,NODE_H=52,H_GAP=52,V_GAP=68;
  const n=rooms.length;
  // Build tree: main spine + optional branches
  // Determine branch points: every 3rd node can branch off
  const spine=[],branches=[];
  let branchEvery=Math.max(2,Math.floor(n/3));
  for(let i=0;i<n;i++){
    if(i>0&&i%branchEvery===0&&branches.length<Math.floor(n/4)&&i<n-1){
      branches.push({from:i-1,node:i});
      spine.push(i+1<n?i+1:-1);
    } else {
      spine.push(i);
    }
  }
  // Assign positions
  const positions=new Array(n);
  // Spine: vertical chain centred at x=0
  let spineX=0,spineY=0,lastSpine=-1;
  const spineNodes=[];
  for(let i=0;i<n;i++){
    const isBranch=branches.some(b=>b.node===i);
    if(!isBranch){spineNodes.push(i)}
  }
  spineNodes.forEach((ni,si)=>{positions[ni]={x:0,y:si*(NODE_H+V_GAP)}});
  // Branches: place to the right of their parent
  branches.forEach(b=>{
    const ppos=positions[b.from]||{x:0,y:0};
    positions[b.node]={x:NODE_W+H_GAP,y:ppos.y};
  });
  // Fill any remaining unassigned
  for(let i=0;i<n;i++){if(!positions[i]){const prev=positions[i-1]||{x:0,y:0};positions[i]={x:0,y:prev.y+NODE_H+V_GAP}}}
  // Build objects
  const rects=rooms.map((t,i)=>({t,name:names[i]||`Zone ${i+1}`,w:NODE_W,h:NODE_H,x:positions[i].x,y:positions[i].y,id:i}));
  // Connections: spine chain + branch edges
  const conns=[];
  spineNodes.forEach((ni,si)=>{if(si>0)conns.push([spineNodes[si-1],ni])});
  branches.forEach(b=>{conns.push([b.from,b.node])});
  return{rects,conns};
}

function regenMap(){
  if(resultIdx<0||!vp.canvas)return;
  const idea=ideas[resultIdx];
  const genData=idea.generator[mapDiff]||idea.generator.easy;
  const {rects,conns}=buildLayout(genData.rooms,genData.names);
  vp.rooms=rects;vp.conns=conns;
  // auto-fit view
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  rects.forEach(r=>{minX=Math.min(minX,r.x);minY=Math.min(minY,r.y);maxX=Math.max(maxX,r.x+r.w);maxY=Math.max(maxY,r.y+r.h)});
  const mw=maxX-minX+80,mh=maxY-minY+80;
  vp.scale=Math.min((vp.canvas.width-40)/mw,(vp.canvas.height-40)/mh,2);
  vp.ox=vp.canvas.width/2-(minX+mw/2-40)*vp.scale;
  vp.oy=vp.canvas.height/2-(minY+mh/2-40)*vp.scale;
  const tag=document.getElementById('vpZoomTag');if(tag)tag.textContent=Math.round(vp.scale*100)+'%';
  // update stats
  const c={green:0,red:0,yellow:0,blue:0,purple:0};rects.forEach(r=>c[r.t]=(c[r.t]||0)+1);
  const st=document.getElementById('mpStats');
  if(st)st.innerHTML=`<div>РАЗМЕР <span>4096×4096</span></div><div>ВСЕГО <span>${rects.length}</span></div><div>КОМНАТЫ <span>${c.green}</span></div><div>ТУННЕЛИ <span>${c.red}</span></div><div>ПЕРЕХОДЫ <span>${c.yellow}</span></div><div>ВОДА <span>${c.blue}</span></div><div>ОСОБЫЕ <span>${c.purple}</span></div><div>СЛОЖНОСТЬ <span>${mapDiff.toUpperCase()}</span></div>`;
  const el=document.getElementById('mpEnts');
  if(el)el.innerHTML=genData.entities.map(e=>`<div class="mp-ent">${e}</div>`).join('');
  drawVP();
}

function initVP(){
  vp.canvas=document.getElementById('vpC');if(!vp.canvas)return;
  const wrap=document.getElementById('vpWrap');
  vp.canvas.width=wrap.offsetWidth||560;vp.canvas.height=wrap.offsetHeight||340;
  vp.ctx=vp.canvas.getContext('2d');
  vp.scale=1;vp.ox=vp.canvas.width/2;vp.oy=vp.canvas.height/2;
  // events
  vp.canvas.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:.89,mx=e.offsetX,my=e.offsetY;vp.ox=(vp.ox-mx)*f+mx;vp.oy=(vp.oy-my)*f+my;vp.scale=Math.max(.1,Math.min(5,vp.scale*f));const t=document.getElementById('vpZoomTag');if(t)t.textContent=Math.round(vp.scale*100)+'%';drawVP()},{passive:false});
  vp.canvas.addEventListener('mousedown',e=>{vp.drag=true;vp.lx=e.clientX;vp.ly=e.clientY});
  document.addEventListener('mouseup',()=>vp.drag=false);
  document.addEventListener('mousemove',e=>{
    if(vp.drag&&vp.canvas){vp.ox+=e.clientX-vp.lx;vp.oy+=e.clientY-vp.ly;vp.lx=e.clientX;vp.ly=e.clientY;drawVP()}
    if(vp.canvas){const r=vp.canvas.getBoundingClientRect(),cx2=Math.round((e.clientX-r.left-vp.ox)/vp.scale*32),cy2=Math.round((e.clientY-r.top-vp.oy)/vp.scale*32);const co=document.getElementById('vp-coords');if(co)co.textContent=`${cx2}u, ${cy2}u`}
  });
  window.addEventListener('resize',()=>{if(!vp.canvas)return;const w=document.getElementById('vpWrap');if(!w)return;vp.canvas.width=w.offsetWidth;vp.canvas.height=w.offsetHeight;drawVP()});
}

function drawVP(){
  const c=vp.ctx,cv=vp.canvas;if(!c||!cv)return;
  const W2=cv.width,H2=cv.height;
  c.clearRect(0,0,W2,H2);c.fillStyle='#06101e';c.fillRect(0,0,W2,H2);
  c.save();c.translate(vp.ox,vp.oy);c.scale(vp.scale,vp.scale);
  // grid
  const GRID=32;
  const vl=-vp.ox/vp.scale,vt=-vp.oy/vp.scale,vr=vl+W2/vp.scale,vb=vt+H2/vp.scale;
  const sx=Math.floor(vl/GRID)*GRID,sy=Math.floor(vt/GRID)*GRID;
  for(let x=sx;x<vr;x+=GRID){const big=x%128===0;c.strokeStyle=big?'rgba(0,180,255,0.15)':'rgba(0,180,255,0.05)';c.lineWidth=(big?1.2:.5)/vp.scale;c.beginPath();c.moveTo(x,vt);c.lineTo(x,vb);c.stroke()}
  for(let y=sy;y<vb;y+=GRID){const big=y%128===0;c.strokeStyle=big?'rgba(0,180,255,0.15)':'rgba(0,180,255,0.05)';c.lineWidth=(big?1.2:.5)/vp.scale;c.beginPath();c.moveTo(vl,y);c.lineTo(vr,y);c.stroke()}
  // axes
  c.strokeStyle='rgba(0,180,255,0.2)';c.lineWidth=.8/vp.scale;
  c.beginPath();c.moveTo(0,vt);c.lineTo(0,vb);c.stroke();
  c.beginPath();c.moveTo(vl,0);c.lineTo(vr,0);c.stroke();

  // connections - L-shaped paths
  vp.conns.forEach(([ai,bi])=>{
    const a=vp.rooms[ai],b=vp.rooms[bi];if(!a||!b)return;
    const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
    // determine connector color: use the type of source room
    const col=ROOM_COL[a.t]||'#4dff4d';
    // draw filled corridor
    const cw=12;
    c.fillStyle=col+'15';
    if(Math.abs(ax-bx)<4){// vertical
      c.fillRect(ax-cw/2,Math.min(ay,by),cw,Math.abs(ay-by));
    } else {// L-shape
      c.fillRect(Math.min(ax,bx),ay-cw/2,Math.abs(ax-bx)+cw/2,cw);
      c.fillRect(bx-cw/2,Math.min(ay,by)-cw/2,cw,Math.abs(ay-by)+cw/2);
    }
    // outline
    c.strokeStyle=col+'66';c.lineWidth=1.5/vp.scale;c.setLineDash([6/vp.scale,4/vp.scale]);
    c.beginPath();c.moveTo(ax,ay);
    if(Math.abs(ax-bx)<4){c.lineTo(bx,by)}
    else{c.lineTo(bx,ay);c.lineTo(bx,by)}
    c.stroke();c.setLineDash([]);
    // door icon at midpoint
    const mx=(Math.abs(ax-bx)<4)?bx:(bx),my=(Math.abs(ax-bx)<4)?( ay+by)/2:ay;
    c.strokeStyle='#ffaa00cc';c.lineWidth=1.5/vp.scale;
    c.strokeRect(mx-5/vp.scale,my-8/vp.scale,10/vp.scale,16/vp.scale);
  });

  // rooms
  const fontSize=Math.max(6,10/vp.scale);
  const fs2=Math.max(5,7/vp.scale);
  vp.rooms.forEach((r,i)=>{
    const col=ROOM_COL[r.t]||'#4dff4d';
    // glow
    c.shadowColor=col;c.shadowBlur=14;
    // body
    c.fillStyle=col+'1a';c.strokeStyle=col;c.lineWidth=1.5/vp.scale;
    c.beginPath();c.roundRect(r.x,r.y,r.w,r.h,4/vp.scale);c.fill();c.stroke();
    c.shadowBlur=0;
    // inner border
    c.strokeStyle=col+'33';c.lineWidth=.7/vp.scale;c.setLineDash([3/vp.scale,3/vp.scale]);
    c.strokeRect(r.x+4/vp.scale,r.y+4/vp.scale,r.w-8/vp.scale,r.h-8/vp.scale);
    c.setLineDash([]);
    // type icon & labels
    c.fillStyle=col;c.font=`bold ${fontSize}px Orbitron,monospace`;c.textAlign='center';c.textBaseline='middle';
    c.fillText(ROOM_LABEL[r.t]||'?',r.x+r.w/2,r.y+r.h/2-fontSize*.6);
    c.fillStyle='#c8e8ff';c.font=`${fs2}px Orbitron,monospace`;
    c.fillText(r.name,r.x+r.w/2,r.y+r.h/2+fontSize*.5);
    // index
    c.fillStyle=col+'88';c.font=`${fs2*.9}px Orbitron,monospace`;
    c.fillText(`#${i+1}`,r.x+4/vp.scale+fs2*.5,r.y+fs2*.8);
    // start/exit markers
    if(i===0){c.strokeStyle='#4dff4d';c.lineWidth=2/vp.scale;c.beginPath();c.roundRect(r.x-3/vp.scale,r.y-3/vp.scale,r.w+6/vp.scale,r.h+6/vp.scale,6/vp.scale);c.stroke();c.fillStyle='#4dff4d';c.font=`${fs2}px Orbitron,monospace`;c.fillText('СТАРТ',r.x+r.w/2,r.y-8/vp.scale)}
    if(i===vp.rooms.length-1){c.strokeStyle='#ff4444';c.lineWidth=2/vp.scale;c.beginPath();c.roundRect(r.x-3/vp.scale,r.y-3/vp.scale,r.w+6/vp.scale,r.h+6/vp.scale,6/vp.scale);c.stroke();c.fillStyle='#ff4444';c.font=`${fs2}px Orbitron,monospace`;c.fillText('ВЫХОД',r.x+r.w/2,r.y-8/vp.scale)}
  });
  c.restore();
}
</script>
</body>
</html>
