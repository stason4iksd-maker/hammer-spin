<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP Foundation — Site Oracle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#c8c8c8;font-family:'Share Tech Mono',monospace;overflow-x:hidden}
#app{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;padding:16px 20px 30px;cursor:none}
/* --- BG --- */
canvas#bgC{position:fixed;inset:0;z-index:0;pointer-events:none}
#vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.92)100%);z-index:1;pointer-events:none}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,140,0,.008)2px,rgba(255,140,0,.008)4px);z-index:1;pointer-events:none}
/* --- CURSOR --- */
#cursor{position:fixed;width:28px;height:28px;pointer-events:none;z-index:200;transform:translate(-50%,-50%)}
/* --- CORNERS --- */
.corner{position:fixed;width:24px;height:24px;z-index:5}
.corner.tl{top:6px;left:6px;border-top:1px solid #ff8c0055;border-left:1px solid #ff8c0055}
.corner.tr{top:6px;right:6px;border-top:1px solid #ff8c0055;border-right:1px solid #ff8c0055}
.corner.bl{bottom:6px;left:6px;border-bottom:1px solid #ff8c0055;border-left:1px solid #ff8c0055}
.corner.br{bottom:6px;right:6px;border-bottom:1px solid #ff8c0055;border-right:1px solid #ff8c0055}
/* --- MAIN CONTENT --- */
#content{position:relative;z-index:10;width:100%;display:flex;flex-direction:column;align-items:center}
/* --- HEADER --- */
.site-header{text-align:center;margin-bottom:14px}
.scp-logo{font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:8px;color:#ff8c00;text-transform:uppercase;opacity:.7}
h1{font-family:'Rajdhani',sans-serif;font-size:13px;letter-spacing:4px;color:#e8d5b0;text-transform:uppercase;margin:4px 0 2px;text-shadow:0 0 10px #ff8c0066}
.sub{font-size:7px;letter-spacing:3px;color:#666;margin-bottom:6px}
.status-bar{display:flex;gap:14px;font-size:7px;color:#555;letter-spacing:2px}
.sb-item{display:flex;align-items:center;gap:4px}
.sb-dot{width:4px;height:4px;border-radius:50%;animation:sbp 2s infinite}
.sb-dot.g{background:#4dff4d}
.sb-dot.o{background:#ff8c00;animation-delay:.5s}
.sb-dot.r{background:#ff4444;animation-delay:1s}
@keyframes sbp{0%,100%{opacity:.25}50%{opacity:1}}
/* --- WHEEL AREA --- */
#wheel-section{display:flex;flex-direction:column;align-items:center;margin-bottom:10px}
#wheel-wrap{position:relative;transition:transform .9s cubic-bezier(.4,0,.2,1)}
#wheel-wrap.dimmed{transform:translateY(120px) scale(.45)!important;opacity:.12;pointer-events:none}
#gR1{position:absolute;inset:-8px;border-radius:50%;border:1px solid #ff8c0018;pointer-events:none;animation:rp 3s ease-in-out infinite}
#gR2{position:absolute;inset:-20px;border-radius:50%;border:1px solid #ff8c000a;pointer-events:none;animation:rp 3.5s ease-in-out infinite .6s}
@keyframes rp{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.02)}}
canvas#whl{display:block}
svg#ndl{position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:5;filter:drop-shadow(0 0 6px #ff8c00)}
#prog-bar{width:300px;height:2px;background:#ff8c0010;margin-top:8px}
#prog-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff8c00,#ff4444);transition:width .05s linear}
/* --- BUTTONS --- */
#btn-row{display:flex;gap:7px;margin-top:11px;align-items:center}
.btn{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;background:transparent;border:1px solid;padding:8px 18px;cursor:none;text-transform:uppercase;transition:all .2s;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,140,0,.1),transparent);transition:left .5s}
.btn:hover::after{left:100%}
.btn-primary{border-color:#ff8c0055;color:#ff8c0099}
.btn-primary:hover{border-color:#ff8c00;color:#ff8c00;box-shadow:0 0 16px #ff8c0033}
.btn-primary:disabled{opacity:.2}
.btn-secondary{border-color:#66666633;color:#66666699;padding:8px 11px}
.btn-secondary:hover{border-color:#888;color:#ccc}
/* --- RESULT AREA --- */
#result-area{position:absolute;top:38px;left:50%;transform:translateX(-50%);z-index:15;opacity:0;pointer-events:none;transition:opacity .5s;width:min(1200px,calc(100% - 24px))}
#result-area.visible{opacity:1;pointer-events:all}
.result-layout{display:flex;gap:14px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
/* --- CARD --- */
.card-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0}
.scp-card{width:278px;background:rgba(10,10,10,.97);border:1px solid #ff8c0033;position:relative;overflow:hidden;animation:cardWob 2.5s ease-in-out infinite}
.scp-card.flipped{animation:none}
.scp-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,140,0,.04),transparent 60%);pointer-events:none}
.card-holo{position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1}
.scp-card:hover .card-holo{opacity:1}
@keyframes cardWob{0%,100%{transform:rotate(-1.5deg) translateY(0)}50%{transform:rotate(1.5deg) translateY(-3px)}}
.card-header{background:rgba(255,140,0,.06);padding:8px 12px;font-size:8px;letter-spacing:3px;color:#ff8c0099;border-bottom:1px solid #ff8c0015;display:flex;align-items:center;justify-content:center;gap:7px;z-index:2;position:relative}
.hl{flex:1;height:1px;background:linear-gradient(90deg,transparent,#ff8c0033)}
.card-body{padding:16px;text-align:center;position:relative;z-index:2}
.card-qmark{font-size:46px;color:#ff8c00;text-shadow:0 0 18px #ff8c0099;animation:qp 1.6s ease-in-out infinite}
@keyframes qp{0%,100%{text-shadow:0 0 10px #ff8c0055;transform:scale(1)}50%{text-shadow:0 0 26px #ff8c00cc;transform:scale(1.06)}}
.card-hint{font-size:8px;color:#ff8c0055;letter-spacing:2px;margin-top:9px;animation:bl 1.8s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.card-back{display:none;padding:12px;text-align:left}
.scp-card.flipped .card-qmark,.scp-card.flipped .card-hint{display:none}
.scp-card.flipped .card-back{display:block}
.scp-num{font-size:7px;color:#ff8c0044;letter-spacing:2px;margin-bottom:4px;text-align:center}
.scp-title{font-family:'Rajdhani',sans-serif;font-size:12px;color:#e8d5b0;letter-spacing:1px;margin-bottom:8px;text-align:center;padding-bottom:6px;border-bottom:1px solid #ff8c0015}
.class-badge{display:inline-block;font-size:7px;letter-spacing:2px;padding:3px 8px;margin:3px 0 1px;border-radius:1px;font-family:'Share Tech Mono',monospace}
.cb-safe{background:rgba(0,180,0,.1);color:#4dff4d;border:1px solid #4dff4d22}
.cb-euclid{background:rgba(255,140,0,.1);color:#ff8c00;border:1px solid #ff8c0022}
.cb-keter{background:rgba(255,0,0,.1);color:#ff4444;border:1px solid #ff444422}
.diff-desc{font-size:9.5px;color:#888;line-height:1.65;margin-top:2px;margin-bottom:7px}
.diff-desc span.cur{border-right:1px solid #ff8c0088}
#card-reset{display:none;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:2px;background:transparent;border:1px solid #ff444433;color:#ff444455;padding:7px;cursor:none;transition:all .2s;margin-top:7px;width:100%}
#card-reset:hover{background:rgba(255,68,68,.06);border-color:#ff4444;color:#ff4444}
#card-reset.visible{display:block}
/* --- MAP PANEL --- */
#map-panel{flex:1;min-width:300px;max-width:740px;background:rgba(10,10,10,.97);border:1px solid #ff8c0018;padding:12px;opacity:0;transform:translateX(14px);transition:opacity .5s,transform .5s;pointer-events:none}
#map-panel.visible{opacity:1;transform:translateX(0);pointer-events:all}
.mp-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ff8c0012;padding-bottom:8px;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.mp-t{font-size:8px;letter-spacing:3px;color:#ff8c0088}
.mp-proj{font-size:7px;color:#55555588;letter-spacing:1px}
/* diff + layer row */
.mp-ctrl-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.mpc{font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:1px;background:transparent;border:1px solid #ffffff18;color:#555;padding:5px 9px;cursor:none;transition:all .2s;text-transform:uppercase}
.mpc:hover{border-color:#ff8c0055;color:#ff8c00}
.mpc.active-safe{background:#4dff4d;color:#0a0a0a;border-color:transparent}
.mpc.active-euclid{background:#ff8c00;color:#0a0a0a;border-color:transparent}
.mpc.active-keter{background:#ff4444;color:#0a0a0a;border-color:transparent}
.mpc.active-layer{background:rgba(255,140,0,.15);color:#ff8c00;border-color:#ff8c0066}
.mpc.active-layer:hover{background:rgba(255,140,0,.25)}
/* layer badge row */
.layer-label{font-size:7px;color:#ff8c0077;letter-spacing:3px;margin-bottom:4px;padding-top:4px;border-top:1px solid #ff8c0012}
/* viewport */
.vp-shell{border:1px solid #ff8c0015;background:#080808}
.vp-topbar{display:flex;justify-content:space-between;padding:5px 10px;border-bottom:1px solid #ff8c000d;font-size:6px;letter-spacing:2px;color:#555;text-transform:uppercase}
.vp-cwrap{position:relative;width:100%;height:320px;overflow:hidden;cursor:none}
canvas.vpc{width:100%;height:100%;display:block}
.vp-ov{position:absolute;pointer-events:none;font-size:6px;letter-spacing:1px;color:#ff8c0044}
/* stats */
.mp-stats{display:flex;flex-wrap:wrap;gap:5px 12px;padding:7px 0 0;font-size:6px;letter-spacing:1px;color:#888;border-top:1px solid #ff8c000d;margin-top:7px;text-transform:uppercase}
.mp-stats span{color:#ff8c00}
.mp-ents{margin-top:7px;padding-top:7px;border-top:1px solid #ff8c000d}
.mp-ent-t{font-size:6px;color:#ff444477;letter-spacing:2px;margin-bottom:5px}
.mp-ent-list{display:flex;flex-wrap:wrap;gap:4px}
.mp-ent{font-size:6px;color:#ff444466;border:1px solid #ff444418;padding:2px 6px;letter-spacing:1px}
.mp-legend{display:flex;flex-wrap:wrap;gap:5px 11px;margin-top:7px;font-size:6px;letter-spacing:1px;color:#888}
.leg{display:flex;align-items:center;gap:4px}
.leg-sw{width:7px;height:7px;border:1px solid currentColor;display:inline-block}
.mp-regen{font-family:'Share Tech Mono',monospace;font-size:7px;letter-spacing:1px;background:transparent;border:1px solid #ff8c0022;color:#ff8c0055;padding:5px 12px;cursor:none;transition:all .2s;margin-top:8px;text-transform:uppercase}
.mp-regen:hover{border-color:#ff8c00;color:#ff8c00;box-shadow:0 0 8px #ff8c0022}
/* --- HISTORY --- */
#hist-panel{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:20;width:340px;background:rgba(10,10,10,.98);border:1px solid #ff8c0022;padding:11px;display:none}
#hist-panel.visible{display:block}
#hist-panel h3{font-size:8px;color:#ff8c0077;letter-spacing:3px;margin-bottom:8px;text-align:center}
.hist-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ffffff05;font-size:8px}
.h-n{color:#ff8c0033;width:18px}.h-t{color:#aaa;flex:1;padding:0 7px}.h-s{color:#ff444455;font-size:7px}
#hist-close{font-size:7px;color:#ff8c0055;background:transparent;border:1px solid #ff8c0018;padding:5px;cursor:none;margin-top:7px;width:100%;letter-spacing:2px;transition:all .2s}
#hist-close:hover{color:#ff8c00;border-color:#ff8c0055}
/* --- FLASH / PARTICLES --- */
canvas#ptc{position:fixed;inset:0;pointer-events:none;z-index:50}
#flash{position:fixed;inset:0;background:#ff8c00;opacity:0;pointer-events:none;z-index:60;transition:opacity .08s}
@media(max-width:820px){#result-area{position:relative;top:auto;left:auto;transform:none;padding-top:28px;width:100%}.result-layout{flex-direction:column;align-items:center}#map-panel{max-width:100%;min-width:0;transform:translateY(10px)}#map-panel.visible{transform:translateY(0)}}
</style>
</head>
<body>
<div id="app">
  <canvas id="bgC"></canvas>
  <div id="vignette"></div>
  <div class="scanlines"></div>
  <svg id="cursor" viewBox="0 0 28 28">
    <circle cx="14" cy="14" r="12" fill="none" stroke="#ff8c00" stroke-width=".7" opacity=".5"/>
    <line x1="14" y1="1" x2="14" y2="8" stroke="#ff8c00" stroke-width=".7"/>
    <line x1="14" y1="20" x2="14" y2="27" stroke="#ff8c00" stroke-width=".7"/>
    <line x1="1" y1="14" x2="8" y2="14" stroke="#ff8c00" stroke-width=".7"/>
    <line x1="20" y1="14" x2="27" y2="14" stroke="#ff8c00" stroke-width=".7"/>
    <circle cx="14" cy="14" r="1.5" fill="#ff4444"/>
  </svg>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div id="flash"></div>
  <canvas id="ptc"></canvas>
  <div id="content">
    <div class="site-header">
      <div class="scp-logo">SCP Foundation</div>
      <h1>Site Construction Oracle</h1>
      <div class="sub">SECURE · CONTAIN · PROTOTYPE · v1.0</div>
      <div class="status-bar">
        <div class="sb-item"><div class="sb-dot g"></div><span>ONLINE</span></div>
        <div class="sb-item"><div class="sb-dot o"></div><span id="spin-ctr">SPIN #0</span></div>
        <div class="sb-item"><div class="sb-dot r"></div><span>O5 LINK</span></div>
      </div>
    </div>
    <div id="wheel-section">
      <div id="wheel-wrap">
        <div id="gR1"></div><div id="gR2"></div>
        <svg id="ndl" width="20" height="28" viewBox="0 0 20 28"><polygon points="10,0 20,28 10,21 0,28" fill="#ff8c00"/><polygon points="10,0 20,28 10,21 0,28" fill="none" stroke="#ffaa44" stroke-width="1"/></svg>
        <canvas id="whl" width="300" height="300"></canvas>
      </div>
      <div id="prog-bar"><div id="prog-fill"></div></div>
      <div id="btn-row">
        <button class="btn btn-primary" id="spin-btn" onclick="spin()">▶ ПОЛУЧИТЬ ЗАДАНИЕ</button>
        <button class="btn btn-secondary" onclick="toggleHist()">📋</button>
        <button class="btn btn-secondary" onclick="spin()">⚡</button>
      </div>
    </div>
    <div id="result-area">
      <div class="result-layout">
        <div class="card-wrap">
          <div class="scp-card" id="scp-card" onclick="flipCard()" onmousemove="holoMv(event)" onmouseleave="holoLv()">
            <div class="card-holo" id="card-holo"></div>
            <div class="card-header"><div class="hl"></div><span>CLASSIFIED ASSIGNMENT</span><div class="hl"></div></div>
            <div class="card-body">
              <div class="card-qmark">?</div>
              <div class="card-hint">[ TAP TO DECLASSIFY ]</div>
              <div class="card-back" id="card-back"></div>
            </div>
          </div>
          <button id="card-reset" onclick="resetAll()">↺ NEW ASSIGNMENT</button>
        </div>
        <div id="map-panel"></div>
      </div>
    </div>
  </div>
  <div id="hist-panel">
    <h3>◆ ASSIGNMENT HISTORY ◆</h3>
    <div id="hist-list"></div>
    <button id="hist-close" onclick="toggleHist()">[ CLOSE ]</button>
  </div>
</div>

// ===== LAYOUT ENGINE =====
function buildLayout(treeNodes){
  const NW=104,NH=52,HG=46,VG=64;
  const children={};const roots=[];
  treeNodes.forEach(nd=>{children[nd.id]=[];if(nd.parent===null)roots.push(nd.id)});
  treeNodes.forEach(nd=>{if(nd.parent!==null&&children[nd.parent]!==undefined)children[nd.parent].push(nd.id)});
  const subW={};
  function cSW(id){const ch=children[id]||[];if(!ch.length){subW[id]=1;return 1}let t=0;ch.forEach(c=>{t+=cSW(c)});subW[id]=Math.max(1,t);return subW[id]}
  roots.forEach(r=>cSW(r));
  const pos={};
  function aPos(id,depth,left){const ch=children[id]||[];const sw=subW[id];pos[id]={x:(left+sw/2-.5)*(NW+HG),y:depth*(NH+VG)};let cl=left;ch.forEach(c=>{aPos(c,depth+1,cl);cl+=subW[c]})}
  let rl=0;roots.forEach(r=>{aPos(r,0,rl);rl+=subW[r]});
  const rects=treeNodes.map(nd=>({t:nd.t,name:nd.name,w:NW,h:NH,x:pos[nd.id]?pos[nd.id].x:0,y:pos[nd.id]?pos[nd.id].y:0,id:nd.id}));
  const conns=[];treeNodes.forEach(nd=>{if(nd.parent!==null){const pi=treeNodes.findIndex(x=>x.id===nd.parent),ci=treeNodes.findIndex(x=>x.id===nd.id);if(pi>=0&&ci>=0)conns.push([pi,ci])}});
  return{rects,conns};
}

function regenMap(){
  if(resultIdx<0||!vp.c)return;
  const idea=ideas[resultIdx];
  const gd=idea.generator[mapDiff]||idea.generator.safe;
  let tree=[...gd.tree.map(n=>({...n}))];
  // Layer 2: add underground nodes
  if(curLayer>=2){
    const maxId=Math.max(...tree.map(n=>n.id));
    const root0=tree.find(n=>n.parent===null);
    if(root0){
      tree.push({id:maxId+1,t:'red',name:'Тех. тоннель L2',parent:root0.id});
      tree.push({id:maxId+2,t:'purple',name:'Подземный центр',parent:maxId+1});
      tree.push({id:maxId+3,t:'green',name:'Служ. отсек L2',parent:maxId+2});
      if(mapDiff==='keter'||mapDiff==='euclid'){
        tree.push({id:maxId+4,t:'red',name:'Бункер L2',parent:maxId+2});
      }
    }
  }
  // Layer 3: deep nodes
  if(curLayer===3){
    const maxId2=Math.max(...tree.map(n=>n.id));
    const deepParent=tree[tree.length-1];
    tree.push({id:maxId2+1,t:'red',name:'Шахта L3',parent:deepParent.id});
    tree.push({id:maxId2+2,t:'purple',name:'Глубокий узел',parent:maxId2+1});
    tree.push({id:maxId2+3,t:'red',name:'Критич. зона',parent:maxId2+2});
    tree.push({id:maxId2+4,t:'purple',name:'Ядро объекта',parent:maxId2+3});
    if(mapDiff==='keter'){
      tree.push({id:maxId2+5,t:'red',name:'Нейтрализация',parent:maxId2+4});
      tree.push({id:maxId2+6,t:'purple',name:'Протокол Omega',parent:maxId2+5});
    }
  }
  const {rects,conns}=buildLayout(tree);
  vp.rooms=rects;vp.conns=conns;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  rects.forEach(r=>{minX=Math.min(minX,r.x);minY=Math.min(minY,r.y);maxX=Math.max(maxX,r.x+r.w);maxY=Math.max(maxY,r.y+r.h)});
  const mw=maxX-minX+80,mh=maxY-minY+80;
  vp.sc=Math.min((vp.c.width-40)/mw,(vp.c.height-40)/mh,2.5);
  vp.ox=vp.c.width/2-(minX+mw/2-40)*vp.sc;
  vp.oy=vp.c.height/2-(minY+mh/2-40)*vp.sc;
  const zt=document.getElementById('vpZt');if(zt)zt.textContent=Math.round(vp.sc*100)+'%';
  const lt=document.getElementById('vp-layer-tag');if(lt)lt.textContent='LAYER '+curLayer;
  const c2={green:0,red:0,yellow:0,blue:0,purple:0};rects.forEach(r=>c2[r.t]=(c2[r.t]||0)+1);
  const mps=document.getElementById('mpS');
  if(mps)mps.innerHTML=`<div>ВСЕГО <span>${rects.length}</span></div><div>ЗОНЫ <span>${c2.green}</span></div><div>ИЗОЛЯТОРЫ <span>${c2.red}</span></div><div>ШЛЮЗЫ <span>${c2.yellow}</span></div><div>ОСОБЫЕ <span>${c2.purple}</span></div><div>КЛАСС <span>${mapDiff.toUpperCase()}</span></div><div>ЭТАЖ <span>L${curLayer}</span></div>`;
  const mpe=document.getElementById('mpE');
  if(mpe)mpe.innerHTML=gd.entities.map(e=>`<div class="mp-ent">${e}</div>`).join('');
  drawVP();
}

function initVP(){

  vp.c.width=wrap.offsetWidth||600;vp.c.height=wrap.offsetHeight||320;
  vp.x=vp.c.getContext('2d');vp.sc=1;vp.ox=vp.c.width/2;vp.oy=vp.c.height/2;
  vp.c.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:.89,mx=e.offsetX,my=e.offsetY;vp.ox=(vp.ox-mx)*f+mx;vp.oy=(vp.oy-my)*f+my;vp.sc=Math.max(.08,Math.min(5,vp.sc*f));const zt=document.getElementById('vpZt');if(zt)zt.textContent=Math.round(vp.sc*100)+'%';drawVP()},{passive:false});

  document.addEventListener('mouseup',()=>vp.drag=false);
  document.addEventListener('mousemove',e=>{if(vp.drag&&vp.c){vp.ox+=e.clientX-vp.lx;vp.oy+=e.clientY-vp.ly;vp.lx=e.clientX;vp.ly=e.clientY;drawVP()}if(vp.c){const r=vp.c.getBoundingClientRect();const cx2=Math.round((e.clientX-r.left-vp.ox)/vp.sc*32),cy2=Math.round((e.clientY-r.top-vp.oy)/vp.sc*32);const co=document.getElementById('vp-co');if(co)co.textContent=`${cx2}u, ${cy2}u`}});
  window.addEventListener('resize',()=>{if(!vp.c)return;const w=document.getElementById('vpW');if(!w)return;vp.c.width=w.offsetWidth;vp.c.height=w.offsetHeight;drawVP()});
}

function drawVP(){
  const c=vp.x,cv=vp.c;if(!c||!cv)return;
  const W2=cv.width,H2=cv.height;
  c.clearRect(0,0,W2,H2);
  const layerBg={1:'#080808',2:'#070b0e',3:'#0b0707'};
  c.fillStyle=layerBg[curLayer]||'#080808';c.fillRect(0,0,W2,H2);
  c.save();c.translate(vp.ox,vp.oy);c.scale(vp.sc,vp.sc);
  const GRID=32,vl=-vp.ox/vp.sc,vt=-vp.oy/vp.sc,vr=vl+W2/vp.sc,vb=vt+H2/vp.sc;
  const sx=Math.floor(vl/GRID)*GRID,sy=Math.floor(vt/GRID)*GRID;
  const layerGrid={1:'rgba(255,140,0,',2:'rgba(0,180,255,',3:'rgba(255,68,68,'};
  const lg=layerGrid[curLayer]||'rgba(255,140,0,';
  for(let x=sx;x<vr;x+=GRID){const big=x%128===0;c.strokeStyle=big?lg+'0.15)':lg+'0.04)';c.lineWidth=(big?1.2:.5)/vp.sc;c.beginPath();c.moveTo(x,vt);c.lineTo(x,vb);c.stroke()}
  for(let y=sy;y<vb;y+=GRID){const big=y%128===0;c.strokeStyle=big?lg+'0.15)':lg+'0.04)';c.lineWidth=(big?1.2:.5)/vp.sc;c.beginPath();c.moveTo(vl,y);c.lineTo(vr,y);c.stroke()}
  c.strokeStyle=lg+'0.2)';c.lineWidth=.8/vp.sc;
  c.beginPath();c.moveTo(0,vt);c.lineTo(0,vb);c.stroke();
  c.beginPath();c.moveTo(vl,0);c.lineTo(vr,0);c.stroke();
  const layerLabel={1:'SURFACE L1',2:'UNDERGROUND L2',3:'DEEP LEVEL L3'};
  c.fillStyle=lg+'0.09)';c.font=`bold ${55/vp.sc}px Share Tech Mono,monospace`;
  c.textAlign='center';c.textBaseline='middle';
  c.fillText(layerLabel[curLayer],vl+(vr-vl)/2,vt+(vb-vt)/2);
  // connections
  vp.conns.forEach(([ai,bi])=>{
    const a=vp.rooms[ai],b=vp.rooms[bi];if(!a||!b)return;
    const ax=a.x+a.w/2,ay=a.y+a.h,bx=b.x+b.w/2,by=b.y;
    const col=ROOM_COL[a.t]||'#ff8c00';
    const midY=(ay+by)/2,cw=8/vp.sc;
    c.fillStyle=col+'10';
    if(Math.abs(ax-bx)<2){c.fillRect(ax-cw/2,ay,cw,by-ay)}
    else{c.fillRect(ax-cw/2,ay,cw,midY-ay);c.fillRect(Math.min(ax,bx)-cw/2,midY-cw/2,Math.abs(ax-bx)+cw,cw);c.fillRect(bx-cw/2,midY,cw,by-midY)}
    c.strokeStyle=col+'77';c.lineWidth=1.2/vp.sc;c.setLineDash([]);
    c.beginPath();c.moveTo(ax,ay);
    if(Math.abs(ax-bx)<2){c.lineTo(bx,by)}else{c.lineTo(ax,midY);c.lineTo(bx,midY);c.lineTo(bx,by)}
    c.stroke();
    const aw=5/vp.sc;c.fillStyle=col+'cc';
    c.beginPath();c.moveTo(bx,by);c.lineTo(bx-aw,by-aw*1.4);c.lineTo(bx+aw,by-aw*1.4);c.closePath();c.fill();
    const dx=Math.abs(ax-bx)<2?ax:(ax+bx)/2,dy=Math.abs(ax-bx)<2?(ay+by)/2:midY;
    c.strokeStyle='#ffaa00aa';c.lineWidth=1.2/vp.sc;
    c.strokeRect(dx-4/vp.sc,dy-7/vp.sc,8/vp.sc,14/vp.sc);
  });
  // rooms
  const fs=Math.max(6,9/vp.sc),fs2=Math.max(5,6.5/vp.sc);
  vp.rooms.forEach((r,i)=>{
    const col=ROOM_COL[r.t]||'#ff8c00';
    c.shadowColor=col;c.shadowBlur=10;
    c.fillStyle=col+'18';c.strokeStyle=col;c.lineWidth=1.4/vp.sc;
    c.beginPath();c.roundRect(r.x,r.y,r.w,r.h,4/vp.sc);c.fill();c.stroke();
    c.shadowBlur=0;
    c.strokeStyle=col+'28';c.lineWidth=.6/vp.sc;c.setLineDash([3/vp.sc,3/vp.sc]);
    c.strokeRect(r.x+4/vp.sc,r.y+4/vp.sc,r.w-8/vp.sc,r.h-8/vp.sc);c.setLineDash([]);
    c.fillStyle=col;c.font=`bold ${fs}px Share Tech Mono,monospace`;
    c.textAlign='center';c.textBaseline='middle';
    c.fillText(ROOM_LABEL[r.t]||'?',r.x+r.w/2,r.y+r.h/2-fs*.65);
    c.fillStyle='#c8c8c8';c.font=`${fs2}px Share Tech Mono,monospace`;
    const words=r.name.split(' ');let line='',lines=[];
    words.forEach(w=>{const test=line+(line?' ':'')+w;if(test.length>13&&line){lines.push(line);line=w}else line=test});
    lines.push(line);
    if(lines.length===1){c.fillText(r.name,r.x+r.w/2,r.y+r.h/2+fs*.5)}
    else{lines.slice(0,2).forEach((ln,li)=>c.fillText(ln,r.x+r.w/2,r.y+r.h/2+fs*.25+li*fs2*1.2))}
    c.fillStyle=col+'88';c.font=`${fs2*.9}px Share Tech Mono,monospace`;
    c.fillText(`#${i+1}`,r.x+4/vp.sc+fs2*.4,r.y+fs2*.8);
    if(i===0){c.strokeStyle='#4dff4d';c.lineWidth=2/vp.sc;c.beginPath();c.roundRect(r.x-3/vp.sc,r.y-3/vp.sc,r.w+6/vp.sc,r.h+6/vp.sc,6/vp.sc);c.stroke();c.fillStyle='#4dff4d';c.font=`${fs2}px Share Tech Mono`;c.textAlign='center';c.fillText('ENTER',r.x+r.w/2,r.y-9/vp.sc)}
    if(i===vp.rooms.length-1){c.strokeStyle='#ff4444';c.lineWidth=2/vp.sc;c.beginPath();c.roundRect(r.x-3/vp.sc,r.y-3/vp.sc,r.w+6/vp.sc,r.h+6/vp.sc,6/vp.sc);c.stroke();c.fillStyle='#ff4444';c.font=`${fs2}px Share Tech Mono`;c.textAlign='center';c.fillText('EXIT',r.x+r.w/2,r.y-9/vp.sc)}
  });
  c.restore();
}
